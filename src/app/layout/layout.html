<header class="header">
  <button mat-icon-button class="menu-toggle" (click)="toggleNav()" [class.hidden]="isDesktop()">
    <mat-icon>{{ navOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>
  <span class="title">{{ title() }}</span>
</header>

<div class="layout">
  <aside class="nav" [class.open]="navOpen()" [class.desktop]="isDesktop()">
    <nav>
      <a routerLink="/home" routerLinkActive="active" class="nav-item">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>
    </nav>
  </aside>
  
  <main class="content">
    <router-outlet />
  </main>
</div>

<div class="overlay" [class.show]="navOpen() && !isDesktop()" (click)="closeNav()"></div>
