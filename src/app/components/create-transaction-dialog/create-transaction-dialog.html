<h1 mat-dialog-title>New Transaction</h1>
<div mat-dialog-content>
  <form [formGroup]="transactionForm" class="transaction-form">
    <mat-form-field appearance="outline">
      <mat-label>Select User</mat-label>
      <mat-select formControlName="selectedUser">
        @for (user of users(); track user.id) {
          <mat-option [value]="user.id">{{ user.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    
    <mat-form-field appearance="outline">
      <mat-label>Select Account</mat-label>
      <mat-select formControlName="toAccountId">
        @for (account of filteredAccounts(); track account.id) {
          <mat-option [value]="account.id">{{ account.name || 'Unnamed Account' }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    
    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="0.00">
      <span matTextSuffix>{{ currency }}</span>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions class="dialog-actions">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onCreate()" [disabled]="!transactionForm.valid">Send</button>
</div>
