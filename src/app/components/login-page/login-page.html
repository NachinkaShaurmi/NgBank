<h1>Sign In</h1>
<form [formGroup]="loginForm">
  <label>Login:
    <input formControlName="login" autocomplete="login"></label>
  <label>Password:
    <input formControlName="password" type="password" id="password" autocomplete="current-password"></label>
  <button (click)="onSubmit()">Sign In</button>
</form>
<div>
  <p>I’m a new user.</p><a href="/sign-up">Sign Up</a>
</div>
